

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

```yaml
schema: spec-driven
githubCopilot:
  cloudAgent: true

context: |
  Project: Porto Seguro Pet

  Domain:
    Sistema de gerenciamento para uma ONG de proteção animal.
    O sistema acompanha o ciclo de atendimento dos animais,
    desde o resgate até a adoção e o acompanhamento pós-adoção,
    além de apoiar a gestão de tutores/adotantes, voluntários,
    doadores e suprimentos.

  Architecture:
    Frontend: Reflex.
    O Reflex é a tecnologia exclusiva para implementação das
    interfaces do frontend. Não introduzir outra tecnologia de
    frontend sem uma mudança explícita da decisão arquitetural.

    Backend: Xano.
    A lógica de backend e os recursos relacionados ao sistema
    devem respeitar a arquitetura definida para o projeto.

  Development:
    O projeto será desenvolvido incrementalmente utilizando
    OpenSpec.

    Mudanças relevantes devem ser especificadas antes da
    implementação.

    O modelo de domínio e as regras gerais do projeto devem
    ser respeitados durante as mudanças.

    Não implementar funcionalidades ou estruturas que não
    estejam previstas na documentação ou em uma mudança
    explicitamente aprovada.

  Project principles:
    Manter a solução simples e enxuta, evitando complexidade
    ou funcionalidades desnecessárias.

    Preservar as regras de negócio definidas para o projeto,
    especialmente as relacionadas ao ciclo de vida do animal,
    adoção, acompanhamento pós-adoção, voluntários, doações
    e estoque.

  Language:
    Escrever a documentação e os artefatos OpenSpec em
    português brasileiro.

rules:
  proposal:
    - Descrever claramente o problema, objetivo e escopo da mudança.
    - Identificar o que está fora do escopo quando necessário.
    - Não propor funcionalidades que não estejam justificadas pela documentação do projeto.

  specs:
    - Escrever requisitos claros e verificáveis.
    - Utilizar cenários para comportamentos relevantes.
    - Respeitar as regras de negócio definidas no projeto.

  tasks:
    - Dividir a implementação em tarefas pequenas e verificáveis.
    - Evitar tarefas que incluam funcionalidades fora do escopo da mudança.

operations:
  apply:
    guidance:
      - Verificar se a implementação corresponde às especificações antes de concluir.
      - Preservar as decisões arquiteturais e as regras do projeto.

  archive:
    guidance:
      - Confirmar que a implementação corresponde à especificação.
      - Manter o histórico das mudanças concluídas sem alterar as regras consolidadas do projeto.
```